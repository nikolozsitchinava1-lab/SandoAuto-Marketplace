openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cars
    description: Verified vehicle inventory and inspection reports
  - name: seller-requests
    description: Seller inspection requests
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /cars:
    get:
      operationId: listCars
      tags: [cars]
      summary: List verified cars
      parameters:
        - name: make
          in: query
          required: false
          schema:
            type: string
        - name: yearFrom
          in: query
          required: false
          schema:
            type: integer
            minimum: 1990
            maximum: 2035
        - name: yearTo
          in: query
          required: false
          schema:
            type: integer
            minimum: 1990
            maximum: 2035
        - name: priceFrom
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: priceTo
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Verified vehicles matching the supplied filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Car"
  /cars/{id}:
    get:
      operationId: getCar
      tags: [cars]
      summary: Get a vehicle and its inspection report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Vehicle with full inspection report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "404":
          description: Vehicle not found
  /seller-requests:
    post:
      operationId: createSellerRequest
      tags: [seller-requests]
      summary: Request a vehicle inspection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellerRequestInput"
      responses:
        "201":
          description: Seller inspection request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerRequest"
        "400":
          description: Request fields are invalid
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    InspectionCheck:
      type: object
      properties:
        name:
          type: string
        score:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [passed, attention]
        note:
          type: string
      required: [name, score, total, status, note]
    Car:
      type: object
      properties:
        id:
          type: integer
        make:
          type: string
        model:
          type: string
        trim:
          type: string
        year:
          type: integer
        mileageKm:
          type: integer
        priceGel:
          type: integer
        engine:
          type: string
        transmission:
          type: string
        fuelType:
          type: string
        imagePath:
          type: string
        inspectionScore:
          type: integer
        inspectionMax:
          type: integer
        inspectionDate:
          type: string
          format: date
        inspectionDetails:
          type: array
          items:
            $ref: "#/components/schemas/InspectionCheck"
        reportNote:
          type: string
      required:
        - id
        - make
        - model
        - trim
        - year
        - mileageKm
        - priceGel
        - engine
        - transmission
        - fuelType
        - imagePath
        - inspectionScore
        - inspectionMax
        - inspectionDate
        - inspectionDetails
        - reportNote
    SellerRequestInput:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          minLength: 7
          maxLength: 30
        vehicleMakeModel:
          type: string
          minLength: 2
          maxLength: 160
        notes:
          type: string
          maxLength: 1000
      required: [fullName, phone, vehicleMakeModel]
    SellerRequest:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [received]
      required: [id, status]

