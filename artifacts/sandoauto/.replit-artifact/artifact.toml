kind = "web"
previewPath = "/"
title = "SandoAuto"
description = "A transparent, report-based used-car marketplace for Georgia, built around verified inspections and clear vehicle evidence."
version = "1.0.0"
id = "artifacts/sandoauto"
router = "path"

[[services]]
name = "web"
paths = [ "/", "/_next" ]
localPort = 19814

[services.development]
run = "pnpm --filter @workspace/sandoauto run dev"

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/sandoauto", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = [ "pnpm", "--filter", "@workspace/sandoauto", "run", "start" ]

[services.production.run.env]
PORT = "19814"
NODE_ENV = "production"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "19814"
